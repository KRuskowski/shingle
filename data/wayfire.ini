[simple-tile]
inner_gap_size = 5
outer_horiz_gap_size = 0
outer_vert_gap_size = 0
key_focus_left = <super> KEY_H
key_focus_right = <super> KEY_L
key_focus_above = <super> KEY_K
key_focus_below = <super> KEY_J
key_toggle_maximized = <super> KEY_M
key_toggle = <super> KEY_T
key_move_left = <super><shift> KEY_H
key_move_right = <super><shift> KEY_L
key_move_above = <super><shift> KEY_K
key_move_below = <super><shift> KEY_J
key_resize_left = <super><ctrl> KEY_H
key_resize_right = <super><ctrl> KEY_L
key_resize_above = <super><ctrl> KEY_K
key_resize_below = <super><ctrl> KEY_J
button_move = <super> BTN_LEFT
button_resize = <super> BTN_RIGHT

[input]
xkb_rules = evdev
xkb_model = pc105
xkb_layout = us
xkb_variant =
xkb_options =

[output:HEADLESS-1]
mode = 1280x720@60
position = 0 0

[idle]
screensaver_timeout = 300
dpms_timeout = 600
lock_timeout = 420
key_lock = <super> KEY_F8

[command]
binding_terminal = <super> KEY_ENTER
command_terminal = foot

[session]
restore = true
