[package]
name = "shingle-lock"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
ab_glyph = "0.2"
bytemuck.workspace = true
calloop = { workspace = true, features = ["signals"] }
# "log" sends its own error lines to `log`, which nothing prints; the
# loop reports a lost connection once itself.
calloop-wayland-source = { version = "0.4.1", features = ["log"] }
libc = "0.2"
pollster.workspace = true
rustix.workspace = true
tempfile = "3"
thiserror.workspace = true
shingle-auth = { path = "../shingle-auth" }
shingle-config = { path = "../shingle-config" }
shingle-render = { path = "../shingle-render" }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
wayland-protocols-wlr = { workspace = true, features = ["client"] }
wgpu.workspace = true
xkbcommon = "0.9"
zeroize.workspace = true

[lints]
workspace = true
