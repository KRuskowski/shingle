# A synthetic wayfire.ini in the shape WCM writes for Wayfire: every
# option of every section in alphabetical order, at Wayfire's metadata
# defaults (WayfireWM/wayfire 669bbe3, fisheye from v0.9.0), with every
# sharp in a value escaped as \#. A few values differ from the defaults to
# test the import, and a few lines show what WCM itself does not write:
# comments, a continued plugins line and the unsupported values noted
# beside them. Nothing here comes from a real user's configuration.

[alpha]
min_value = 0.1
modifier = <super> <alt>

[animate]
close_animation = fire
duration = 400ms
enabled_for = (type equals "toplevel" | (type equals "x-or" & focusable equals true))
fade_duration = 400ms
fade_enabled_for = type equals "overlay"
fire_color = \#b22303ff
fire_duration = 300ms linear
fire_enabled_for = none
fire_particle_size = 16.0
fire_particles = 2000
minimize_animation = squeezimize
open_animation = zoom
random_fire_color = false
spin_duration = 250ms linear
spin_rotations = 1
squeezimize_duration = 150ms linear
startup_duration = 250ms linear
zap_duration = 250ms linear
zoom_duration = 500ms circle
zoom_enabled_for = none

[autostart]
0_env = true
autostart_wf_shell = false
panel = true synthetic-panel

[blur]
alpha_exponent = 1.0
alpha_threshold = 0.5
blur_by_default = type is "toplevel"
bokeh_degrade = 1
bokeh_iterations = 15
bokeh_offset = 5
box_degrade = 1
box_iterations = 2
box_offset = 1
gaussian_degrade = 1
gaussian_iterations = 2
gaussian_offset = 1
kawase_degrade = 3
kawase_iterations = 2
kawase_offset = 1.7
method = kawase
saturation = 1.0
toggle = none

[command]
binding_menu = <super>
binding_screenshot = KEY_PRINT
binding_slash = <super> KEY_SLASH
binding_terminal = <super> KEY_ENTER
command_menu = synthetic-menu
command_screenshot = synthetic-shot --tag \#1
command_slash = synthetic-echo trailing\\
command_terminal = synthetic-terminal
command_volume_up = synthetic-volume +5
repeatable_binding_volume_up = KEY_VOLUMEUP

[core]
background_color = \#1A2B3CFF
close_top_view = <super> KEY_Q | <alt> KEY_F4
exit = <ctrl> <alt> KEY_BACKSPACE
focus_button_with_modifiers = false
focus_buttons = BTN_LEFT | BTN_MIDDLE | BTN_RIGHT
focus_buttons_passthrough = true
max_render_time = -1
# WCM writes the plugin list on one line; Wayfire's own wayfire.ini
# continues it, as here.
plugins = alpha animate autostart command cube decoration expo \
  fast-switcher foreign-toplevel grid gtk-shell idle invert move oswitch \
  place preserve-output resize session-lock shortcuts-inhibit \
  simple-tile switcher vswitch wayfire-shell window-rules wobbly wrot zoom
preferred_decoration_mode = client
transaction_timeout = 100
vheight = 3
vwidth = 3
xwayland = false
xwayland_startup_script = 

[cube]
activate = <ctrl> <alt> BTN_LEFT
background = 0.1 0.1 0.1 1.0
background_mode = simple
cubemap_image = 
deform = 0
initial_animation = 350ms
light = true
rotate_left = none
rotate_right = none
skydome_mirror = true
skydome_texture = 
speed_spin_horiz = 0.02
speed_spin_vert = 0.02
speed_zoom = 0.07
zoom = 0.1

[decoration]
active_color = \#222222aa
border_size = 4
button_order = minimize maximize close
button_padding = 4
button_scale = 0.7
font = sans-serif
font_color = \#ffffffff
font_scale = 0.8
forced_views = none
ignore_views = none
inactive_color = \#333333dd
title_halign = left
title_height = 30
title_valign = top

[expo]
background = 0.1 0.1 0.1 1.0
duration = 300ms circle
inactive_brightness = 0.7
keyboard_interaction = true
offset = 10
select_workspace_1 = KEY_1
select_workspace_2 = KEY_2
select_workspace_3 = KEY_3
select_workspace_4 = KEY_4
select_workspace_5 = KEY_5
select_workspace_6 = KEY_6
select_workspace_7 = KEY_7
select_workspace_8 = KEY_8
select_workspace_9 = KEY_9
toggle = <super> KEY_E | hotspot top-left 10x10 500
transition_length = 200

[extra-gestures]
close_fingers = 20
move_delay = 750
move_fingers = 3

[fast-switcher]
activate = <alt> KEY_ESC
activate_backward = <alt> <shift> KEY_ESC
inactive_alpha = 0.70

[fisheye]
radius = 450.0
toggle = <super> <ctrl> KEY_F
zoom = 7.0

[foreign-toplevel]

[grid]
duration = 300ms
restore = <super> KEY_DOWN | <super> KEY_KP0
slot_b = <super> KEY_KP2
slot_bl = <super> KEY_KP1
slot_br = <super> KEY_KP3
slot_c = <super> KEY_UP | <super> KEY_KP5
slot_l = <super> KEY_LEFT | <super> KEY_KP4
slot_r = <super> KEY_RIGHT | <super> KEY_KP6
slot_t = <super> KEY_KP8
slot_tl = <super> KEY_KP7
slot_tr = <super> KEY_KP9
type = crossfade

[gtk-shell]
global_menu_bar = false

[idle]
cube_max_zoom = 1.5
cube_rotate_speed = 1.0
cube_zoom_speed = 1000
disable_initially = false
disable_on_fullscreen = true
dpms_timeout = -1
screensaver_timeout = 3600
toggle = none

[input]
3fg_drag = default
click_method = default
cursor_size = 24
cursor_theme = default
disable_touchpad_while_mouse = false
disable_touchpad_while_typing = false
drag_lock = false
gesture_finger_count = 3
gesture_sensitivity = 1.0
kb_capslock_default_state = false
kb_numlock_default_state = false
kb_repeat_delay = 400
kb_repeat_rate = 40
left_handed_mode = false
middle_emulation = false
modifier_binding_timeout = 400
mouse_accel_profile = default
mouse_cursor_speed = 0.0
mouse_natural_scroll = false
mouse_scroll_speed = 1.0
natural_scroll = false
scroll_method = default
tablet_motion_mode = default
tap_and_drag = true
tap_to_click = true
touchpad_accel_profile = default
touchpad_cursor_speed = 0.0
touchpad_scroll_speed = 1.0
xkb_file = 
xkb_layout = us
xkb_model = 
xkb_options = 
xkb_rules = evdev
xkb_variant = 

[input-device]
calibration = 
output = 

[input-device:Synthetic Pen]
calibration = 
output = HEADLESS-1

[input-method-v1]
enable_text_input_v1 = true
enable_text_input_v3 = true

[invert]
preserve_hue = false
toggle = <super> KEY_I

[ipc]

[ipc-rules]

[move]
activate = <super> BTN_LEFT
enable_snap = true
enable_snap_off = true
join_views = false
preview_base_border = 0.25 0.25 0.5 0.8
preview_base_color = 0.5 0.5 1 0.5
preview_border_width = 3
quarter_snap_threshold = 50
snap_off_threshold = 10
snap_threshold = 10
workspace_switch_after = -1

[oswitch]
above_output = 
below_output = 
left_output = 
next_output = <super> KEY_O
next_output_with_win = <super> <shift> KEY_O
prev_output = 
prev_output_with_win = 
right_output = 

[output]
depth = 8
hdr = false
icc_profile = 
min_render_budget = -1
mode = auto
position = auto
scale = 1.0
transform = normal
vrr = false
vrr_idle_refresh_rate = 0

[output:DP-7]
depth = 8
hdr = false
icc_profile = 
min_render_budget = -1
mode = mirror HEADLESS-1
position = auto
scale = 1.0
transform = normal
vrr = false
vrr_idle_refresh_rate = 0

[output:HEADLESS-1]
depth = 8
hdr = false
icc_profile = 
min_render_budget = -1
mode = auto
position = auto
scale = 1.0
transform = normal
vrr = false
vrr_idle_refresh_rate = 0

[place]
# Not a Wayfire placement mode: warns and keeps the default.
mode = smart

[preserve-output]
last_output_focus_timeout = 10000

[resize]
activate = <super> BTN_RIGHT
activate_preserve_aspect = disabled
corner_threshold = 0.33
min_height = 0
min_width = 0

[scale]
allow_zoom = false
bg_color = 0.1 0.1 0.1 0.9
close_on_new_view = false
duration = 750ms
inactive_alpha = 0.75
include_minimized = false
middle_click_close = false
minimized_alpha = 0.45
outer_margin = 0
spacing = 50
text_color = 0.8 0.8 0.8 1.0
title_font_size = 16
title_overlay = all
title_position = center
toggle = <super> KEY_P | pinch in 4
toggle_all = 

[scale-title-filter]
bg_color = 0.0 0.0 0.0 0.5
case_sensitive = false
font_size = 30
overlay = true
share_filter = false
text_color = 0.8 0.8 0.8 0.8

[session-lock]

[shortcuts-inhibit]
break_grab = disabled
ignore_views = none
inhibit_by_default = none

[simple-tile]
animation_duration = 0
button_move = <super> BTN_LEFT
button_resize = <super> BTN_RIGHT
inner_gap_size = 7 # differs from the default
keep_fullscreen_on_adjacent = true
key_focus_above = <super> KEY_K
key_focus_below = <super> KEY_J
key_focus_left = <super> KEY_H
key_focus_right = <super> KEY_L
key_toggle = <super> KEY_T
key_toggle_maximized = <super> KEY_M
outer_horiz_gap_size = 0
outer_vert_gap_size = 0
preview_base_border = 0.25 0.25 0.5 0.8
preview_base_color = 0.5 0.5 1 0.5
preview_border_width = 3
tile_by_default = all

[switcher]
next_view = <alt> KEY_TAB
prev_view = <alt> <shift> KEY_TAB
speed = 500
view_thumbnail_rotation = 30
view_thumbnail_scale = 1.0

[vswipe]
background = 0.1 0.1 0.1 1.0
delta_threshold = 24.0
duration = 180ms
enable_free_movement = false
enable_horizontal = true
enable_smooth_transition = false
enable_vertical = true
fingers = 4
gap = 32.0
speed_cap = 0.05
speed_factor = 256.0
threshold = 0.35

[vswitch]
background = 0.1 0.1 0.1 1.0
binding_1 = <super> KEY_1
binding_down = <super> <alt> KEY_DOWN
binding_last = 
binding_left = <super> <alt> KEY_LEFT
binding_right = <super> <alt> KEY_RIGHT
binding_up = <super> <alt> KEY_UP
duration = 300
gap = 20
send_win_down = 
send_win_last = 
send_win_left = 
send_win_right = 
send_win_up = 
with_win_down = 
with_win_last = 
with_win_left = <super> <alt> <shift> KEY_LEFT
with_win_right = <super> <alt> <shift> KEY_RIGHT
with_win_up = <super> <alt> <shift> KEY_UP
wraparound = false

[wayfire-shell]
toggle_menu = <super>

[window-rules]
rule_float = on created if app_id is "synthetic-float" then set alpha 0.9
rule_far = on created if app_id is "synthetic-far" then assign_workspace 5 5

[wm-actions]
bring_to_front = disabled
minimize = disabled
send_to_back = disabled
toggle_always_on_bottom = disabled
toggle_always_on_top = disabled
toggle_fullscreen = disabled
toggle_maximize = disabled
toggle_showdesktop = disabled
toggle_sticky = disabled

[wobbly]
friction = 3.0
grid_resolution = 6
spring_k = 8.0

[workarounds]
all_dialogs_modal = true
app_id_mode = stock
auto_reload_config = true
config_reload_delay = 20
disable_primary_selection = false
discard_command_output = true
dynamic_repaint_delay = false
enable_input_method_v2 = false
enable_opaque_region_damage_optimizations = false
enable_so_unloading = false
focus_main_surface_instead_of_popup = false
force_frame_sync = false
force_preferred_decoration_mode = false
force_xwayland_scaling = false
keep_last_toplevel_activated = true
max_buffer_size = 16384
remove_output_limits = false
use_external_output_configuration = false
use_native_buffer_size = false

[wrot]
activate = <super> <ctrl> BTN_RIGHT
activate-3d = <super> <shift> BTN_RIGHT
invert = false
reset = <super> <ctrl> KEY_R
reset-one = <super> KEY_R
reset_radius = 25.0
sensitivity = 24

[wsets]
label_duration = 2s linear

[xdg-activation]
check_surface = false
only_last_request = false
timeout = 30

[zoom]
interpolation_method = 0
modifier = <super>
smoothing_duration = 300ms linear
speed = 0.01

