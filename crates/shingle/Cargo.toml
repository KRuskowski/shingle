[package]
name = "shingle"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Wayland protocol, input, output and IPC core of Shingle"

[lints]
workspace = true

[dependencies]
calloop.workspace = true
drm = "0.15.0"
drm-ffi = "0.9.1"
rustix.workspace = true
serde_json.workspace = true
thiserror.workspace = true
shingle-config = { path = "../shingle-config" }
shingle-core = { path = "../shingle-core" }
shingle-idle = { path = "../shingle-idle" }
shingle-session = { path = "../shingle-session" }
shingle-xwayland = { path = "../shingle-xwayland" }
wayland-protocols.workspace = true
wayland-protocols-wlr.workspace = true
wayland-protocols-misc.workspace = true
wayland-server.workspace = true
# Code for the protocols in protocols/, which no protocol crate has.
wayland-scanner = "0.31.11"
xcursor.workspace = true
xkbcommon.workspace = true

[dev-dependencies]
libc = "0.2"
wayland-client = "0.31"

# The Wayland probe client for tools/xwayland_test/run.py; its own unit
# tests run with the workspace's.
[[example]]
name = "wl_probe"
test = true

# The stalled-acquire probe for tools/gpu_test/run.py (DB-5).
[[example]]
name = "syncobj_probe"
test = true
