[package]
name = "shingle-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# Raw Vulkan for the DMA-BUF capability query and the queue-family
# ownership barriers; the same version wgpu-hal is built with.
ash = { version = "0.38", default-features = false, features = ["std"] }
bytemuck.workspace = true
thiserror.workspace = true
wgpu.workspace = true

[dev-dependencies]
pollster.workspace = true
rustix.workspace = true
# The frame layout and its pixels, for the pinned frame in
# tests/offscreen_pixels.rs. The cycle is a dev-dependency only, and the
# integration tests link the one shingle-render the frontend uses.
shingle = { path = "../shingle" }
shingle-config = { path = "../shingle-config" }
shingle-core = { path = "../shingle-core" }
shingle-frontend = { path = "../shingle-frontend" }

[lints]
workspace = true
